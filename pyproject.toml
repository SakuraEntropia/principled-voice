[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "principled-voice"
version = "0.1.0"
description = "Local, reproducible, coupled voice authoring for Kororu"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kokoro==0.9.4", "misaki[en]==0.9.4", "torch==2.15.0",
  "transformers==4.46.1", "huggingface-hub==0.36.0",
  "numpy>=2,<3", "scipy>=1.13,<2", "soundfile>=0.13,<1",
  "pydantic>=2.10,<3", "psutil>=7,<8", "librosa>=1.0.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]
kv = ["parler-tts @ git+https://github.com/huggingface/parler-tts.git@d108732cd57788ec86bc857d99a6cabd66663d68"]
evaluation = ["faster-whisper==1.2.1"]

[project.scripts]
pv = "principled_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded real model weights"]

[tool.ruff]
line-length = 100

